- _target_: project.plots.sequence_plots.SequenceScorePlotter.from_config
  name: sequence_score_plotter
  task: ${data.ds_type}
  num_samples: 10000
  batch_size: 256
  compute_target_class_fbd: true
  compute_random_baseline: true
  reference_split: test
  workdir: data/dna/workdir
  cache_dir: ${data.cache_dir}

- _target_: project.plots.reconstruction_accuracy.ReconstructionAccuracyPlot
  name: reconstruction_accuracy
  num_t_buckets: 10
  min_samples_per_bucket: 256
