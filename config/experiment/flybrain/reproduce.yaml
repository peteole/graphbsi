# @package _global_
# Reproduce FlyBrain enhancer FBD metrics (Table 3).
defaults:
  - /experiment/flybrain/base

load_checkpoint: final_checkpoints/flybrain/last.ckpt
exp: reproduce_flybrain
wandb:
  mode: disabled
  name: reproduce_flybrain

task:
  sampler:
    variable_noise:
      max_function_evals: 100
      rho: 1.0
      step_method:
        method: ornstein-uhlenbeck
        noise_scale: 5.0
        condition_on_prior: false
