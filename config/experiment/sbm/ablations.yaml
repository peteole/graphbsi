# @package _global_
defaults:
  - /experiment/sbm/base
load_checkpoint: final_checkpoints/sbm/last.ckpt
exp: ablations_sbm
hydra:
  sweeper:
    params:
      task.sampler.variable_noise.step_method.noise_scale: 15,20,25,30
      task.sampler.variable_noise.max_function_evals: 50
      # task.sampler.variable_noise.step_method.bayesian_till: 0.05
      task.sampler.variable_noise.rho: 1.0
      task.sampler.variable_noise.step_method.condition_on_prior: false
      # task.sampler.variable_noise.step_method.method: euler-maruyama
      # task.sampler.variable_noise.step_method.method: ornstein-uhlenbeck
      task.sampler.variable_noise.step_method.method: euler-maruyama,ornstein-uhlenbeck