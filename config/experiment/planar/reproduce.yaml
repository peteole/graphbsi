# @package _global_
# Reproduce planar synthetic-graph metrics (Table 2).
defaults:
  - /experiment/planar/base

load_checkpoint: final_checkpoints/planar/last.ckpt
exp: reproduce_planar
wandb:
  mode: disabled
  name: reproduce_planar

task:
  sampler:
    variable_noise:
      max_function_evals: 1000
      rho: 1.0
      step_method:
        method: ornstein-uhlenbeck
        noise_scale: 200.0
        condition_on_prior: false
