# @package _global_

defaults:
  - /experiment/mel2/base
# hydra:
#   launcher:

hydra:
  sweeper:
    params:
      task.sampler.variable_noise.step_method.noise_scale: 5,10,15
      task.sampler.variable_noise.max_function_evals: 100
      # task.sampler.variable_noise.step_method.bayesian_till: 0.05
      task.sampler.variable_noise.rho: 1.0
      task.sampler.variable_noise.step_method.condition_on_prior: false
      # task.sampler.variable_noise.step_method.method: euler-maruyama
      # task.sampler.variable_noise.step_method.method: ornstein-uhlenbeck
      task.sampler.variable_noise.step_method.method: ornstein-uhlenbeck,euler-maruyama


exp: ablations_mel2
load_checkpoint: final_checkpoints/mel2/last.ckpt 
