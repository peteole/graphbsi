# @package _global_
# Reproduce tree synthetic-graph metrics (Table 2).
defaults:
  - /experiment/tree/base

load_checkpoint: final_checkpoints/tree/last.ckpt
exp: reproduce_tree
wandb:
  mode: disabled
  name: reproduce_tree

task:
  sampler:
    variable_noise:
      max_function_evals: 1000
      rho: 1.0
      step_method:
        method: ornstein-uhlenbeck
        noise_scale: 200.0
        condition_on_prior: false
