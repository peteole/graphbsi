# @package _global_

defaults:
  - /experiment/guacamol/base
exp: train_guacamol
task:
  sampler:
    variable_noise:
      max_function_evals: 50
      rho: 1.0
      step_method:
        method: ornstein-uhlenbeck
        noise_scale: 1000.0
        condition_on_prior: true

trainer:
  max_epochs: 400
  log_every_n_steps: 5
  # profiler: simple
  check_val_every_n_epoch: 10
  gradient_clip_val: 0.5
  accumulate_grad_batches: 1
