# config/sampler/non_bayesian_sampler.yaml
# @package _group_
flowback:
  _target_: project.samplers.flowback_sampler.FlowBackSampler
  name: FlowBackSampler(function_evals=${.time_discretization_steps},rho=${.rho},reconstruction_mode=${.reconstruction_mode},resample_prior=${.resample_initial_belief})
  time_discretization_steps: 500
  rho: 1.0
  t_max: 1.0
  resample_initial_belief: false
  reconstruction_mode: smooth